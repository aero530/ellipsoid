[package]
name = "ellipsoid-app"
description = "Desktop and web GUI for the ellipsoid flat-pattern generator."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# Only used on Windows, and only to put the icon and the version stamp into the
# .exe — see build.rs. Not needed to build or run the app.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
ellipsoid-core.workspace = true
ellipsoid-pattern.workspace = true
bevy = { workspace = true, features = [
    "3d",
    "bevy_winit",
    "mesh_picking",     # Phase 6: cutout placement needs the mesh picking backend
    "png",
    "tonemapping_luts",
] }
bevy_egui.workspace = true
# NOTE: no "bevy_egui" feature — it pins bevy_egui ^0.40 and we run 0.41.
bevy_panorbit_camera.workspace = true

serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["multi_threaded"] }
# Default features are xdg-portal + wayland, so no GTK dependency on Linux and
# CI needs no extra system packages.
rfd = "0.17"
# Both only for the window icon — see `platform::set_window_icon`. Bevy already
# builds both, and these versions are the ones it resolves, so neither adds a
# crate to the build. winit in particular has to match whatever bevy_winit
# picked, since the icon is handed to a window that bevy_winit created.
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
# Per-platform config path for the settings remembered between sessions.
directories = "6"

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 rather than WebGPU: broader browser support, and the web build is a demo.
bevy = { workspace = true, features = ["webgl2"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Opening a file has no synchronous form in the browser; rfd's wasm backend
# wraps `<input type="file">` and hands back a future.
rfd = "0.17"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "HtmlAnchorElement",
    "Storage",
    "Url",
    "Window",
] }
