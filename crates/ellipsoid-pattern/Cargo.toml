[package]
name = "ellipsoid-pattern"
description = "2D scene model and SVG emitter for ellipsoid flat patterns."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ellipsoid-core.workspace = true
glam.workspace = true
serde.workspace = true
# The notes layer stamps the settings that produced the pattern.
serde_json.workspace = true
# Subtracting cutouts from the cut outline. Unlike the strip clipping in
# `cutouts.rs`, this one is a genuine boolean against a concave polygon and
# cannot be sidestepped by changing coordinates.
i_overlay = "7"
earcutr = "0.5.0"
