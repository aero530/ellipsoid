[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["P. Spindler <aero530@gmail.com>"]
repository = "https://github.com/aero530/ellipsoid"
# Driven by bevy 0.19 / bevy_egui 0.41, which declare 1.95. See rust-toolchain.toml.
rust-version = "1.95"

[workspace.dependencies]
ellipsoid-core = { path = "crates/ellipsoid-core" }
ellipsoid-pattern = { path = "crates/ellipsoid-pattern" }

# glam 0.32 is what bevy_math 0.19 depends on. Keep these in lockstep so that
# DVec3::as_vec3() yields *bevy's* Vec3 rather than a same-named type from a
# second glam. Core math is f64 (DVec3) because the 1e-9 parity tolerance in
# Phase 1 is unreachable in f32; f32 appears only at the mesh boundary.
glam = { version = "0.32", features = ["serde"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# --- Bevy stack: pinned as a unit. See RUST_CONVERSION_PLAN.md appendix. ---
# bevy_panorbit_camera's `bevy_egui` feature wants bevy_egui ^0.40 while we run
# 0.41, so it is deliberately left OFF (it has no default features). We gate
# camera input against egui by hand, which the render-to-texture viewports in
# Phase 5 need anyway.
bevy = { version = "0.19", default-features = false }
bevy_egui = "0.41"
bevy_panorbit_camera = "0.35"

# Dependencies get optimized, our crates don't: fast Bevy at dev-build speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
