[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
#
# No "msi": the Windows installer is built by installer/build.ps1 and published by
# .github/workflows/installer.yml. dist's msi is a cargo-wix template that has to be hand-edited
# to be usable and then defended from `dist generate`, it installs per-machine behind a UAC
# prompt, and it produces one package per binary — so the app and the command-line tool arrived
# as two separate installs of the same program. See the plan's Appendix Y.
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
#
# No aarch64-unknown-linux-gnu: dist would build it on an x86_64 runner, and
# Bevy's C dependencies (alsa, udev, wayland, xkbcommon) need a cross
# sysroot to link. Adding it means either an arm64 runner or `cross`, and the
# desktop app has no arm64 Linux audience to speak of. Both Macs are here
# because Apple Silicon is not optional.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Bevy links against these on Linux; without them the x86_64-unknown-linux-gnu
# build fails at link time rather than anywhere informative. Same list as the
# CI workflow installs.
[dist.dependencies.apt]
libasound2-dev = '*'
libudev-dev = '*'
libwayland-dev = '*'
libxkbcommon-dev = '*'
