[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax).
#
# No aarch64-unknown-linux-gnu: dist would build it on an x86_64 runner, and
# Bevy's C dependencies (alsa, udev, wayland, xkbcommon) need a cross
# sysroot to link. Adding it means either an arm64 runner or `cross`, and the
# desktop app has no arm64 Linux audience to speak of. Both Macs are here
# because Apple Silicon is not optional.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The WiX definition is ours now, not dist's.
#
# crates/ellipsoid-app/wix/main.wxs is hand-edited to add a Start Menu shortcut
# and the product icon. Without this, `dist plan` fails outright ("has out of
# date contents and needs to be regenerated") and takes every release with it,
# and `dist generate` silently reverts the edits.
allow-dirty = ["msi"]

# Bevy links against these on Linux; without them the x86_64-unknown-linux-gnu
# build fails at link time rather than anywhere informative. Same list as the
# CI workflow installs.
[dist.dependencies.apt]
libasound2-dev = '*'
libudev-dev = '*'
libwayland-dev = '*'
libxkbcommon-dev = '*'
