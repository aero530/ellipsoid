name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Bevy links a lot; keep CI logs and disk usage sane.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the channel (stable) plus the components and
      # wasm target, so no setup-toolchain action is needed — rustup honours it
      # on the first cargo invocation.
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # crates/ellipsoid-app/wix/main.wxs is hand-edited and only stays that way
      # because of `allow-dirty = ["msi"]` in dist-workspace.toml. Drop that
      # line and `dist generate` reverts the Start Menu shortcut and the product
      # icon — a silently plainer installer nobody notices until a user asks
      # where the app went.
      - name: msi-customisation
        run: |
          wxs=crates/ellipsoid-app/wix/main.wxs
          # Anchored to the start of the line on purpose. Every one of these
          # names also appears in the stock template — two in the explanatory
          # comment at the top, the icon pair inside a commented-out block that
          # the customisation uncomments — so a substring match would keep
          # passing after the markup itself had been reverted.
          for pattern in \
            "^ *<Directory Id='ProgramMenuFolder'" \
            "^ *<Component Id='StartMenuShortcut'" \
            "^ *<ComponentRef Id='StartMenuShortcut'" \
            "^ *Name='Ellipsoid Pattern Generator'" \
            "^ *<Icon Id='ProductICO'" \
            "^ *<Property Id='ARPPRODUCTICON'"
          do
            grep -qE "$pattern" "$wxs" \
              || { echo "::error file=$wxs::no line matching /$pattern/ — did 'dist generate' overwrite the hand edits? See the note at the top of the file."; exit 1; }
          done
          test -f crates/ellipsoid-app/wix/Product.ico \
            || { echo "::error::wix/Product.ico is missing; the msi will not build"; exit 1; }

  # Builds the installer from the WiX source against a stub executable. No cargo
  # and no release build, so it costs seconds — and it is the only thing here
  # that would have caught either of the two ways the MSI was broken before it
  # ever shipped:
  #
  #   * `SourceFile='wix\Product.ico'` resolves against light's working
  #     directory, which for a workspace is the repository root (LGHT0103).
  #   * a non-advertised shortcut in the binary's own component fails ICE43 and
  #     ICE57 — a Start Menu entry is per-user data, the binary is per-machine.
  #
  # Both pass `dist plan` and both pass every grep above. Only candle and light
  # have an opinion.
  msi:
    name: msi builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # WiX 3.14 ships with the runner image and sets %WIX%; cargo-wix looks for
      # candle and light under its `bin`. If a future image drops it, this fails
      # loudly here rather than during a release.
      - name: Locate WiX
        shell: pwsh
        run: |
          if (-not $env:WIX) { throw "no %WIX% on this runner; WiX Toolset v3 is required to build the msi" }
          "WIX=$env:WIX"
          & "$env:WIX\bin\candle.exe" -? | Select-Object -First 1

      # candle and light only need the file to exist — they read its size and
      # version, not its code.
      - name: Build the installer from a stub binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stub | Out-Null
          Set-Content -Path stub\ellipsoid-app.exe -Value 'stub' -Encoding ascii
          Set-Content -Path stub\ellipsoid.exe -Value 'stub' -Encoding ascii
          $bin = (Resolve-Path stub).Path
          $failed = $false
          foreach ($crate in 'ellipsoid-app', 'ellipsoid-cli') {
            $wxs = "crates\$crate\wix\main.wxs"
            Write-Output "== $wxs =="
            & "$env:WIX\bin\candle.exe" -nologo -arch x64 "-dCargoTargetBinDir=$bin" `
              '-dVersion=0.0.0' '-dPlatform=x64' -out "$crate.wixobj" $wxs
            if ($LASTEXITCODE -ne 0) { $failed = $true; continue }
            & "$env:WIX\bin\light.exe" -nologo -ext WixUIExtension -ext WixUtilExtension `
              -cultures:en-us -out "$crate.msi" "$crate.wixobj"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw "the WiX source does not build; see the candle/light errors above" }

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Bevy system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest
      - run: trunk build --release
      - name: Report bundle size
        run: |
          echo "### wasm bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.wasm; do
            raw=$(stat -c %s "$f")
            br=$(brotli -c -q 11 "$f" | wc -c)
            printf '%-40s raw %6.1f MB   brotli %5.1f MB\n' \
              "$(basename "$f")" \
              "$(echo "$raw/1048576" | bc -l)" \
              "$(echo "$br/1048576" | bc -l)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: dist/
