name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Bevy links a lot; keep CI logs and disk usage sane.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the channel (stable) plus the components and
      # wasm target, so no setup-toolchain action is needed — rustup honours it
      # on the first cargo invocation.
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Builds the installer from its WiX source against stub binaries, on every push.
  #
  # `-SkipBuild` is what makes this cheap: no cargo, no release build, seconds once the pinned
  # WiX is cached. It still runs the real build.ps1, so the licence RTF, the generated artwork,
  # candle and light — including ICE validation — are all exercised.
  #
  # Worth having because the installer that this replaced was broken in two ways that nothing
  # short of running light would show: a `SourceFile` path that resolved against the wrong
  # directory, and a shortcut in a component that failed ICE43 and ICE57. Both passed `dist plan`
  # and every static check that was in this file.
  #
  # It does not install anything; that is installer/verify.ps1, which runs in the release
  # workflow where the binaries are real.
  msi:
    name: installer builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache WiX toolset
        uses: actions/cache@v4
        with:
          path: target/installer-tools
          key: ${{ runner.os }}-wix-${{ hashFiles('installer/build.ps1') }}

      # candle and light only need the files to exist — they read their size, not their code.
      - name: Build the installer from stub binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          Set-Content -Path target/release/ellipsoid-app.exe -Value 'stub' -Encoding ascii
          Set-Content -Path target/release/ellipsoid.exe -Value 'stub' -Encoding ascii
          ./installer/build.ps1 -SkipBuild -PinnedWix

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Bevy system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest
      - run: trunk build --release
      - name: Report bundle size
        run: |
          echo "### wasm bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.wasm; do
            raw=$(stat -c %s "$f")
            br=$(brotli -c -q 11 "$f" | wc -c)
            printf '%-40s raw %6.1f MB   brotli %5.1f MB\n' \
              "$(basename "$f")" \
              "$(echo "$raw/1048576" | bc -l)" \
              "$(echo "$br/1048576" | bc -l)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: dist/
