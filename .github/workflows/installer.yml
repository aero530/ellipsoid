# Build the Windows installer and attach it to the GitHub release.
#
# Triggered by pushing a version tag, or manually from the Actions tab. Tests run first:
# shipping an installer for code that does not pass its own suite is worse than shipping
# nothing.
#
# Separate from the dist-generated release.yml on purpose. dist builds the archives and the
# shell installers for every platform and creates the release itself; it cannot build this MSI,
# because its own is a per-machine cargo-wix template and its `extra-artifacts` hook runs on the
# Linux global-artifacts runner. So the two run side by side on the same tag and this one
# uploads into the release dist creates — see the wait below.
name: Windows installer

on:
  push:
    tags: ['**[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (defaults to the workspace version)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and components, so rustup honours it on the first
      # cargo invocation and no toolchain action is needed.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-installer-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-installer-

      # Cached separately from the build: a 41 MB download that never changes unless the pinned
      # version in build.ps1 does.
      - name: Cache WiX toolset
        uses: actions/cache@v4
        with:
          path: target/installer-tools
          key: ${{ runner.os }}-wix-${{ hashFiles('installer/build.ps1') }}

      - name: Check
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # -PinnedWix ignores the WiX that windows-latest happens to ship, so the artifact does not
      # depend on the runner image.
      - name: Build installer
        run: ./installer/build.ps1 -PinnedWix ${{ inputs.version && format('-Version {0}', inputs.version) || '' }}

      # The runner has no GPU and no interactive session, so the check that the GUI opens a
      # window says nothing useful there. Everything else — the per-user install, both binaries,
      # the shortcut, the PATH entry, the command-line tool actually generating a pattern,
      # reinstall, uninstall and cleanup — runs.
      - name: Verify the installer installs, runs and uninstalls
        run: ./installer/verify.ps1 -SkipGui

      - uses: actions/upload-artifact@v4
        with:
          name: ellipsoid-installer
          path: target/installer/*.msi
          if-no-files-found: error

      # dist's workflow creates the release from the same tag, and the two run concurrently.
      # Waiting is what keeps the upload from racing it; failing after the wait is right, because
      # by then the release genuinely is not coming.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $deadline = (Get-Date).AddMinutes(20)
          while (-not (gh release view $tag 2>$null)) {
            if ((Get-Date) -gt $deadline) {
              throw "no release for $tag after 20 minutes; did the dist workflow fail?"
            }
            Write-Host "waiting for the $tag release to be created..."
            Start-Sleep -Seconds 20
          }
          $msi = (Get-Item target/installer/*.msi).FullName
          gh release upload $tag $msi --clobber
        env:
          GH_TOKEN: ${{ github.token }}
